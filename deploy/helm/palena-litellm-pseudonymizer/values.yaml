# Default values for palena-litellm-pseudonymizer.

# -- Number of guardrail service replicas (ignored when autoscaling.enabled).
replicaCount: 2

image:
  repository: ghcr.io/palenaai/palena-litellm-pseudonymizer
  # -- Overrides the image tag (defaults to .Chart.AppVersion).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

# -- Resource requests/limits for the guardrail service.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    # Several config.languages load the language classifier's models (~140Mi).
    memory: 512Mi

# ---------------------------------------------------------------------------
# Guardrail behaviour → PALENA_PSEUDONYMIZER_* env vars. See docs/CONFIG.md.
# ---------------------------------------------------------------------------
config:
  logLevel: info          # debug | info | warn | error
  logFormat: json         # json | text
  # ner      — PERSON from the bundled NER service (GLiNER2, one multilingual
  #            model, no language detection; see `ner` below), pattern types
  #            (email, phone, IBAN, card, IP, …) from Presidio.
  # presidio — everything from Presidio's spaCy NER, one model per language
  #            (config.language / config.languages).
  detectionEngine: ner
  scoreThreshold: 0.7
  # Entity types detected & pseudonymized. Add structured PII to opt in:
  # e.g. "PERSON,EMAIL_ADDRESS,PHONE_NUMBER,IBAN_CODE,CREDIT_CARD".
  # ORGANIZATION is off by default: product and tool names (Linux, Bitwarden,
  # CLI) were most of the false positives. With detectionEngine ner it uses
  # the model's zero-shot "organization" label — experimental, not benchmarked.
  # LOCATION is intentionally excluded by default (city drift).
  entities: "PERSON"
  # Per-type minimum score, overriding scoreThreshold: "TYPE:score,…".
  # Presidio scores every phone number 0.4, so without the default override
  # PHONE_NUMBER would never be masked under the 0.7 threshold.
  entityScoreThreshold: "PHONE_NUMBER:0.4"
  # Language Presidio analyzes in, when `languages` is empty. With
  # detectionEngine ner this is the language of the pattern recognizers only.
  language: en
  # detectionEngine presidio only (ignored with ner, which needs no language).
  # Several languages (en, de, fr, it): each message is classified among them
  # and analyzed in its own language; the first is the fallback for text too
  # short to classify. Anything other than English alone switches the
  # analyzer to presidio.analyzer.multilingualImage, and each extra language
  # needs roughly 800Mi more analyzer memory (raise
  # presidio.analyzer.resources accordingly).
  languages: []
  #   - en
  #   - de
  # Substitution strategy. Nominal identities (PERSON/ORG/LOCATION) use
  # realistic fake names; structured PII (cards, SSNs, emails, IDs) uses
  # reversible tokens like <CREDIT_CARD_1>.
  # entityStrategyDefault applies to enabled non-nominal types; entityStrategy
  # overrides per type, e.g. "PHONE_NUMBER:pool,CREDIT_CARD:token".
  entityStrategyDefault: token
  entityStrategy: ""
  decomposePersonNames: true
  # Terms never pseudonymized even when detected (your brand/product names,
  # public figures, words a detector over-tags). Comma-separated,
  # case-insensitive; also matches short inflected forms ("Linuxra",
  # "Docker's"). A span with the term among other words ("Siri Johnson") is
  # still pseudonymized.
  allowList: ""
  # Add the built-in list of product, platform and tool names (ChatGPT,
  # Bitwarden, Kubernetes, Linux, Heroku, Proton Pass, …). Names that are
  # also people's names (Alexa, Siri, Claude, Jenkins, Kafka) are NOT in it —
  # add them to allowList when your traffic is about the products.
  allowListBuiltin: true
  maxRequestBytes: 33554432
  session:
    metadataKey: session_id
    ttlSeconds: 3600
  nonText:
    piiAction: redact     # redact | block | passthrough
    maxImageBytes: 20971520
    maxImagesPerRequest: 20
  # Pseudonym pools. Empty lists fall back to the service's built-in
  # defaults (gender-neutral persons + neutral orgs). Provide a
  # comma-free YAML list to override.
  pools:
    person: []
    organization: []
    location: []

# -- Shared-secret API key clients must send as `x-api-key`. When disabled
#    the service accepts any request (dev mode).
apiKey:
  enabled: false
  # Provide a value to have the chart create a Secret, OR reference an
  # existing Secret with existingSecret/existingSecretKey.
  value: ""
  existingSecret: ""
  existingSecretKey: api-key

# -- Deterministic pseudonyms: when enabled, pool assignment uses a keyed HMAC
#    so the same real name maps to the same pseudonym across sessions. Secret-
#    grade; wired as a Secret just like apiKey.
deterministic:
  enabled: false
  value: ""
  existingSecret: ""
  existingSecretKey: deterministic-secret

# ---------------------------------------------------------------------------
# Redis (session mapping store).
# ---------------------------------------------------------------------------
redis:
  # -- Bundle a single-instance Redis. Disable and set `url` to use your own
  #    (managed Redis strongly recommended for production).
  enabled: true
  # External URL when enabled=false, e.g. redis://my-redis:6379/0
  url: ""
  keyPrefix: "palena:pseudonymizer"
  image: redis:7-alpine
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 256Mi }
  # -- Bundled Redis is ephemeral by default. Enable for a PVC.
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""

# ---------------------------------------------------------------------------
# NER service (config.detectionEngine: ner): GLiNER2-PII on CPU, model baked
# into the image (no network access needed at runtime).
# ---------------------------------------------------------------------------
ner:
  # -- Bundle the NER service. Disable and set `url` to use your own.
  enabled: true
  url: ""   # external URL when enabled=false, e.g. http://ner:3000
  image:
    repository: ghcr.io/palenaai/palena-ner
    # -- Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  # -- Minimum span confidence (config.entityScoreThreshold overrides per type).
  threshold: 0.9
  # -- Entity type → model labels. A type is taken from the NER service only
  #    when it is also in config.entities.
  entityLabels: "PERSON:person|full_name|first_name|last_name,ORGANIZATION:organization"
  # -- Every line (message) is analyzed on its own; lines longer than
  #    chunkChars characters are cut into windows overlapping by chunkOverlap.
  #    The model is trained on short inputs and stops finding names past
  #    ~512 tokens, so keep chunkChars around 1000.
  chunkChars: 1000
  chunkOverlap: 150
  # -- Texts per HTTP call from the pseudonymizer / per forward pass in the model.
  requestBatchSize: 16
  modelBatchSize: 8
  timeoutSeconds: 10
  # -- CPU threads torch uses; match resources.limits.cpu.
  torchThreads: 2
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: "2", memory: 3Gi }

# ---------------------------------------------------------------------------
# Presidio (external PII detection).
# ---------------------------------------------------------------------------
presidio:
  analyzer:
    # -- Bundle Presidio Analyzer. Disable and set `url` to use your own.
    enabled: true
    url: ""   # external URL when enabled=false, e.g. http://presidio-analyzer:3000
    image: mcr.microsoft.com/presidio-analyzer:latest
    # -- Analyzer image used when config.languages holds anything other than
    #    English alone: Presidio plus the German, French and Italian spaCy
    #    models (the stock image ships English only). Tag defaults to the
    #    chart's appVersion.
    multilingualImage:
      repository: ghcr.io/palenaai/palena-presidio-analyzer
      tag: ""
    # -- ORGANIZATION detection via spaCy NER. ON by default so orgs are
    #    masked even when no deny-list is configured. spaCy ORG is somewhat
    #    noisy (occasional false positives) — set false to rely solely on
    #    the deny-list below.
    nerOrganization: true
    # -- Optional exact-match list of known organization names (zero false
    #    positives, high precision). Complements NER. When non-empty the
    #    chart mounts a full recognizer registry with this deny-list added.
    #    Populate with your real client/company names.
    organizations: []
    #   - Novartis
    #   - Roche
    #   - Contoso Ltd
    # -- Exact-match deny-lists for any entity type: terms that are always
    #    detected (and pseudonymized) as that type, in every configured
    #    language. The entity must also be listed in config.entities.
    denyLists: []
    #   - entity: PERSON
    #     terms: [Project Falcon]
    #   - entity: ORGANIZATION
    #     terms: [Contoso Ltd, Fabrikam]
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "2", memory: 2Gi }
  imageRedactor:
    # -- Bundle Presidio Image Redactor. Disable and set `url` for your own.
    enabled: true
    url: ""   # external URL when enabled=false
    image: mcr.microsoft.com/presidio-image-redactor:latest
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "2", memory: 2Gi }

# ---------------------------------------------------------------------------
# Scaling / availability / observability (all optional).
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# -- Pod-level knobs.
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
nodeSelector: {}
tolerations: []
affinity: {}
